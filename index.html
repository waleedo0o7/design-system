<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="vendors/bootstrap/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link href="style.css" rel="stylesheet">

    <title>Hello, world!</title>

</head>

<body>

    <div class="flex-start gap-4 bg-gray mb-3">
        <h1> 11 </h1>
        <h1> 22 </h1>
        <h1> 33 </h1>
        <h1> 44 </h1>
    </div>

    <div class="flex-end gap-4 bg-gray mb-3">
        <h1> 11 </h1>
        <h1> 22 </h1>
        <h1> 33 </h1>
        <h1> 44 </h1>
    </div>

    <div class="flex-between gap-4 bg-gray mb-3">
        <h1> 11 </h1>
        <h1> 22 </h1>
    </div>



    <div class="flex-between gap-4 bg-gray">

        <!-- start class here is just class ملهوش لازمه بس عشان نجمع عناصر  -->
        <!-- كأنة container لمجموعه عناصر او wrapper  -->
        <div class="start flex-start gap-4">
            <h1> 11 </h1>
            <h1> 22 </h1>
        </div>

        <!-- end هنا بردو كأنه container -->
        <div class="end flex-start gap-4">
            <h1> 33 </h1>
            <h1> 44 </h1>
        </div>

    </div>








    <!-- jquery -->
    <script src="vendors/jquery/jquery-4.0.0.min.js"></script>

    <!-- bootstrap JS -->
    <script src="vendors/bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- custom JS -->
    <script src="js/custom.js"></script>

</body>

</html>
